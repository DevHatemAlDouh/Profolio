name: Update repository cache

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-cache
  cancel-in-progress: false

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh cached projects
        run: node scripts/update-repositories.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated cache
        run: |
          git add public/repositories.json
          if git diff --cached --quiet -- public/repositories.json; then
            echo "Repository cache is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update cached repository data"
          git push
